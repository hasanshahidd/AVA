<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orb" cx="0.36" cy="0.30" r="0.9">
      <stop offset="0" stop-color="#B3CDE0"/>
      <stop offset="0.42" stop-color="#3279A3"/>
      <stop offset="1" stop-color="#011F4B"/>
    </radialGradient>
  </defs>
  <!-- orbiting radar ring (perspective) behind the sphere -->
  <ellipse cx="32" cy="32" rx="30" ry="11" fill="none" stroke="#6497B1" stroke-width="2.6" opacity="0.55" transform="rotate(-22 32 32)"/>
  <!-- 3D sphere = the internet-facing attack surface -->
  <circle cx="32" cy="32" r="17" fill="url(#orb)"/>
  <!-- specular highlight for depth -->
  <ellipse cx="25.5" cy="25" rx="5.5" ry="3.6" fill="#ffffff" opacity="0.5"/>
  <!-- detected exposure on the orbit -->
  <circle cx="57" cy="25" r="2.9" fill="#6497B1"/>
</svg>
